[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wythe-plugin-solver-internals"
version = "0.1.0"
description = "Optional pure-Python C++/Protobuf solver-engine architecture plugin for Wythe: ConstraintProto 7-stage coverage matrix, SatParameters knob lineage, Model::GetOrCreate<T>() singleton graph, and wrapper parity."
readme = "README.md"
license = "MIT"
authors = [{ name = "Euda1mon1a" }]
requires-python = ">=3.12"
keywords = [
  "wythe",
  "cp-sat",
  "ortools",
  "protobuf",
  "solver-internals",
  "static-analysis",
  "lineage",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Euda1mon1a/wythe"
Repository = "https://github.com/Euda1mon1a/wythe"
Issues = "https://github.com/Euda1mon1a/wythe/issues"

[project.entry-points."wythe.plugins"]
solver_internals = "wythe_plugin_solver_internals.plugin:SOLVER_INTERNALS_PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/wythe_plugin_solver_internals"]
