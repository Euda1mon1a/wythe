[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wythe-plugin-agent-harness"
version = "0.1.0"
description = "Optional LLM, SLM, and MCP agent-harness architecture plugin for Wythe (AGENT-001..003)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Euda1mon1a" }]
requires-python = ">=3.12"
keywords = [
  "wythe",
  "static-analysis",
  "mcp",
  "llm",
  "slm",
  "agent-harness",
  "kv-cache",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml>=6.0.2",
]

[project.entry-points."wythe.plugins"]
agent-harness = "wythe_plugin_agent_harness:register_wythe_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/wythe_plugin_agent_harness"]
