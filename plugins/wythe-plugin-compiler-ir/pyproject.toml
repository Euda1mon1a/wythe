[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wythe-plugin-compiler-ir"
version = "0.1.0"
description = "Optional Zoom-2 compiler IR (IndexStoreDB USR, Swift SIL, LLVM IR) and CPU-to-Metal AIR compute seam verifier plugin for Wythe."
readme = "README.md"
license = "MIT"
authors = [{ name = "Euda1mon1a" }]
requires-python = ">=3.12"
keywords = [
  "wythe",
  "compiler-ir",
  "llvm-ir",
  "swift-sil",
  "usr",
  "metal",
  "air",
  "static-analysis",
  "lineage",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Euda1mon1a/wythe"
Repository = "https://github.com/Euda1mon1a/wythe"
Issues = "https://github.com/Euda1mon1a/wythe/issues"

[project.entry-points."wythe.plugins"]
compiler_ir = "wythe_plugin_compiler_ir.plugin:COMPILER_IR_PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/wythe_plugin_compiler_ir"]
