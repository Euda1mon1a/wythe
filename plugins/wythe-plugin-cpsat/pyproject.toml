[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wythe-plugin-cpsat"
version = "0.1.0"
description = "Optional pure-Python OR-Tools CP-SAT domain lineage, Zoom-2 variable-constraint lattice, and CpModelProto/CpSolverResponse companion correlator for Wythe."
readme = "README.md"
license = "MIT"
authors = [{ name = "Euda1mon1a" }]
requires-python = ">=3.12"
keywords = [
  "wythe",
  "cp-sat",
  "ortools",
  "operations-research",
  "static-analysis",
  "lineage",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Euda1mon1a/wythe"
Repository = "https://github.com/Euda1mon1a/wythe"
Issues = "https://github.com/Euda1mon1a/wythe/issues"

[project.entry-points."wythe.plugins"]
cpsat = "wythe_plugin_cpsat:register_wythe_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/wythe_plugin_cpsat"]
