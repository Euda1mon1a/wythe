[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wythe"
version = "0.1.0"
description = "Why -> Therefore: 3-tier architecture verifier, cross-boundary lineage solver, and 3D WebGL atlas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Montgomery" }]
requires-python = ">=3.12"
keywords = [
  "architecture",
  "lineage",
  "static-analysis",
  "mcp",
  "openapi",
  "sarif",
  "three-tier",
  "accessibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
treesitter = [
  "tree-sitter>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-go>=0.23.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-go>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Euda1mon1a/wythe"
Repository = "https://github.com/Euda1mon1a/wythe"
Issues = "https://github.com/Euda1mon1a/wythe/issues"

[project.scripts]
wythe = "app.cli:main"
truth-atlas = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
artifacts = ["backend/app/ui_dist/**"]

[tool.hatch.build.targets.wheel.sources]
"backend/app" = "app"

[tool.hatch.build.targets.sdist]
include = [
  "backend/app/**",
  "backend/schema.sql",
  "backend/tests/**",
  "README.md",
  "LICENSE",
]
artifacts = ["backend/app/ui_dist/**"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
src = ["backend"]
target-version = "py312"
line-length = 100
