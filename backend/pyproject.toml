[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wythe"
version = "0.1.0"
description = "Wythe — 3-tier truth & lineage verifier: DB holds truth, Backend manipulates truth, UI displays truth."
license = "MIT"
authors = [{ name = "Aaron Montgomery" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
treesitter = [
  "tree-sitter>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-go>=0.23.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-go>=0.23.0",
]

[project.scripts]
wythe = "app.cli:main"
truth-atlas = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/ui_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
