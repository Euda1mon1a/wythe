name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build 3D WebGL UI + Python sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build static 3D WebGL UI into wheel bundle
        run: |
          uv sync --extra dev
          uv run wythe export-openapi --out frontend/openapi.json
          cd frontend
          npm ci
          npm run generate:types
          npm run type-check
          npm run build
          rm -rf ../backend/app/ui_dist
          cp -R out ../backend/app/ui_dist

      - name: Verify strict self-gate & tests before packaging
        run: |
          uv run ruff check backend/app backend/tests
          uv run pytest -v
          uv run wythe gate --strict wythe
          uv build

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI via OIDC Trusted Publishing
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wythe
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
